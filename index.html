<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Servicios Tecnicos cerca de Ti</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 font-sans text-gray-100">

    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 py-4 px-4 sm:px-6 flex flex-wrap justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-blue-400 cursor-pointer" onclick="location.href='index.html'">Nexumservice</h1>
        <div id="navAuth" class="flex gap-2 mt-2 sm:mt-0">
            <button onclick="openModal('login')" class="text-gray-300 font-medium hover:text-white px-3 py-2 transition">Ingresar</button>
            <button onclick="openModal('register')" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Registrarse</button>
        </div>
        <div id="navUser" class="hidden flex items-center gap-3 mt-2 sm:mt-0">
            <span class="text-gray-300 text-sm">Hola, <span id="navNombre" class="font-semibold text-white"></span></span>
            <button onclick="goProfile()" class="text-blue-400 hover:text-blue-300 text-sm font-medium transition">Mi Perfil</button>
            <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm font-medium transition">Salir</button>
        </div>
    </nav>

    <!-- Hero -->
    <header class="max-w-4xl mx-auto text-center my-8 md:my-16 px-4">
        <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-4 leading-tight">Encuentra técnicos confiables en tu zona</h2>
        <p class="text-gray-400 text-base md:text-lg mb-8 px-2">Carpinteros, fontaneros y soldadores listos para ayudarte hoy mismo.</p>
        <div class="bg-gray-900 p-4 rounded-xl shadow-lg border border-gray-800 flex flex-col md:flex-row gap-3 md:gap-4 items-center">
            <div class="w-full relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">🔍</span>
                <input type="text" placeholder="¿Qué servicio buscas?" class="w-full pl-10 pr-4 py-3 bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-900 transition">
            </div>
            <div class="w-full relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">📍</span>
                <select class="w-full pl-10 pr-4 py-3 bg-gray-800 border border-gray-700 text-white rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-900 transition appearance-none cursor-pointer">
                    <option value="" disabled selected>¿En qué país?</option>
                    <option value="ar">🇦🇷 Argentina</option>
                    <option value="bo">🇧🇴 Bolivia</option>
                    <option value="br">🇧🇷 Brasil</option>
                    <option value="cl">🇨🇱 Chile</option>
                    <option value="co">🇨🇴 Colombia</option>
                    <option value="cr">🇨🇷 Costa Rica</option>
                    <option value="cu">🇨🇺 Cuba</option>
                    <option value="ec">🇪🇨 Ecuador</option>
                    <option value="sv">🇸🇻 El Salvador</option>
                    <option value="gt">🇬🇹 Guatemala</option>
                    <option value="hn">🇭🇳 Honduras</option>
                    <option value="mx">🇲🇽 México</option>
                    <option value="ni">🇳🇮 Nicaragua</option>
                    <option value="pa">🇵🇦 Panamá</option>
                    <option value="py">🇵🇾 Paraguay</option>
                    <option value="pe">🇵🇪 Perú</option>
                    <option value="do">🇩🇴 República Dominicana</option>
                    <option value="uy">🇺🇾 Uruguay</option>
                    <option value="ve">🇻🇪 Venezuela</option>
                </select>
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">▼</span>
            </div>
            <button class="w-full md:w-auto bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 active:bg-blue-800 transition shadow-lg">Buscar</button>
        </div>
    </header>

    <!-- Servicios -->
    <main class="max-w-5xl mx-auto px-4 pb-16">
        <h3 class="text-xl md:text-2xl font-bold text-white mb-6 px-2">Nuestros Servicios</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6" id="servicesGrid"></div>
    </main>

    <!-- Modal Login -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[100] p-4 opacity-0 transition-opacity duration-300" onclick="if(event.target===this) closeModal('login')">
        <div class="bg-gray-900 rounded-2xl shadow-2xl w-full max-w-md p-6 md:p-8 relative transform scale-95 transition-transform duration-200 border border-gray-800" id="loginContent">
            <button onclick="closeModal('login')" class="absolute top-4 right-4 text-gray-500 hover:text-white text-2xl leading-none transition">&times;</button>
            <h3 class="text-2xl font-bold text-white mb-2">Bienvenido de vuelta</h3>
            <p class="text-gray-400 mb-6 text-sm">Ingresa a tu cuenta para continuar</p>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Correo electrónico</label>
                    <input type="email" name="email" required placeholder="tu@email.com" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-900 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-900 transition">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 active:bg-blue-800 transition shadow-lg">Iniciar Sesión</button>
            </form>
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-2 bg-gray-900 text-gray-500">¿No tienes cuenta?</span></div>
            </div>
            <button onclick="closeModal('login'); openModal('register')" class="w-full border border-gray-700 text-gray-300 py-3 rounded-lg font-semibold hover:bg-gray-800 hover:text-white transition">Crear cuenta nueva</button>
        </div>
    </div>

    <!-- Modal Registro -->
    <div id="registerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[100] p-4 opacity-0 transition-opacity duration-300" onclick="if(event.target===this) closeModal('register')">
        <div class="bg-gray-900 rounded-2xl shadow-2xl w-full max-w-sm max-h-[85vh] flex flex-col border border-gray-800 transform scale-95 transition-transform duration-300" id="registerContent">
            <div class="p-5 pb-3 border-b border-gray-800 shrink-0">
                <button onclick="closeModal('register')" class="absolute top-4 right-4 text-gray-500 hover:text-white text-xl leading-none transition">&times;</button>
                <h3 class="text-xl font-bold text-white">Crear cuenta</h3>
                <p class="text-gray-400 text-xs mt-1">Únete a Nexumservice</p>
            </div>
            <div class="overflow-y-auto p-5 pt-3 space-y-3 custom-scrollbar">
                <form id="registerForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Nombre completo</label>
                        <input type="text" name="nombre" required placeholder="Ej: Juan Pérez" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg focus:outline-none focus:border-blue-500 text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Correo electrónico</label>
                        <input type="email" name="email" required placeholder="tu@email.com" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg focus:outline-none focus:border-blue-500 text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Contraseña</label>
                        <input type="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg focus:outline-none focus:border-blue-500 text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Confirmar contraseña</label>
                        <input type="password" name="confirmPassword" required minlength="6" placeholder="Repite tu contraseña" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg focus:outline-none focus:border-blue-500 text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Teléfono <span class="text-gray-500 font-normal">(opcional)</span></label>
                        <input type="tel" name="telefono" placeholder="+56 9 1234 5678" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg focus:outline-none focus:border-blue-500 text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">País</label>
                        <div class="relative">
                            <select name="pais" required class="w-full px-3 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:outline-none focus:border-blue-500 text-sm appearance-none cursor-pointer transition">
                                <option value="" disabled selected>Selecciona tu país</option>
                                <option value="ar">🇦🇷 Argentina</option>
                                <option value="bo">🇧🇴 Bolivia</option>
                                <option value="br">🇧🇷 Brasil</option>
                                <option value="cl">🇨🇱 Chile</option>
                                <option value="co">🇨🇴 Colombia</option>
                                <option value="cr">🇨🇷 Costa Rica</option>
                                <option value="cu">🇨🇺 Cuba</option>
                                <option value="ec">🇪🇨 Ecuador</option>
                                <option value="sv">🇸🇻 El Salvador</option>
                                <option value="gt">🇬🇹 Guatemala</option>
                                <option value="hn">🇭🇳 Honduras</option>
                                <option value="mx">🇲🇽 México</option>
                                <option value="ni">🇳🇮 Nicaragua</option>
                                <option value="pa">🇵🇦 Panamá</option>
                                <option value="py">🇵🇾 Paraguay</option>
                                <option value="pe">🇵🇪 Perú</option>
                                <option value="do">🇩🇴 República Dominicana</option>
                                <option value="uy">🇺🇾 Uruguay</option>
                                <option value="ve">🇻🇪 Venezuela</option>
                            </select>
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs">▼</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-2">¿Cómo quieres usar Nexumservice?</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="tipo" value="cliente" checked class="peer sr-only">
                                <div class="text-center p-2 rounded-lg border border-gray-700 bg-gray-800 text-gray-400 peer-checked:border-blue-500 peer-checked:bg-blue-900/30 peer-checked:text-blue-400 transition">
                                    <div class="text-xl mb-0.5">🔍</div>
                                    <span class="text-xs font-medium">Buscar</span>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="tipo" value="proveedor" class="peer sr-only">
                                <div class="text-center p-2 rounded-lg border border-gray-700 bg-gray-800 text-gray-400 peer-checked:border-blue-500 peer-checked:bg-blue-900/30 peer-checked:text-blue-400 transition">
                                    <div class="text-xl mb-0.5">🛠️</div>
                                    <span class="text-xs font-medium">Ofrecer</span>
                                </div>
                            </label>
                        </div>
                    </div>
                    <label class="flex items-start gap-2 cursor-pointer">
                        <input type="checkbox" name="terminos" required class="mt-0.5 w-3.5 h-3.5 bg-gray-800 border-gray-600 rounded text-blue-600 focus:ring-blue-500">
                        <span class="text-gray-400 text-xs">Acepto los <a href="#" class="text-blue-400 hover:text-blue-300">términos</a> y <a href="#" class="text-blue-400 hover:text-blue-300">privacidad</a></span>
                    </label>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 active:bg-blue-800 transition shadow-lg text-sm">Crear cuenta</button>
                </form>
                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                    <div class="relative flex justify-center"><span class="px-2 bg-gray-900 text-gray-500 text-xs">¿Ya tienes cuenta?</span></div>
                </div>
                <button onclick="closeModal('register'); openModal('login')" class="w-full border border-gray-700 text-gray-300 py-2.5 rounded-lg font-semibold hover:bg-gray-800 hover:text-white transition text-sm">Iniciar sesión</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 z-[200] px-6 py-3 rounded-lg shadow-lg font-medium"></div>

    <script>
        const API = 'http://localhost:3000/api';
        const services = [
            {icon:'🪚', name:'Carpintería'},{icon:'👨‍🏭', name:'Soldadura'},{icon:'🧱', name:'Albañilería'},
            {icon:'👷‍♂️', name:'Ingeniería'},{icon:'🔧', name:'Fontanería'},{icon:'🧑‍🔧🚗', name:'Mecánico'},
            {icon:'🧹', name:'Limpieza de Casa'},{icon:'🚗', name:'Lavado de Autos'},
            {icon:'🎨', name:'Pintura de Casa'},{icon:'⚡', name:'Electricistas'}
        ];
        document.getElementById('servicesGrid').innerHTML = services.map(s =>
            `<div class="bg-gray-900 p-5 md:p-6 rounded-xl border border-gray-800 text-center shadow-sm hover:shadow-lg hover:-translate-y-1 hover:border-gray-700 cursor-pointer transition-all duration-200 active:scale-95">
                <div class="text-3xl md:text-4xl mb-3">${s.icon}</div>
                <h4 class="font-bold text-gray-100 text-sm md:text-base">${s.name}</h4>
            </div>`
        ).join('');

        function openModal(type) {
            const m = document.getElementById(type+'Modal'), c = document.getElementById(type+'Content');
            m.classList.remove('hidden'); m.classList.add('flex');
            setTimeout(()=>{m.classList.remove('opacity-0');c.classList.remove('scale-95');c.classList.add('scale-100');},10);
        }
        function closeModal(type) {
            const m = document.getElementById(type+'Modal'), c = document.getElementById(type+'Content');
            m.classList.add('opacity-0'); c.classList.remove('scale-100'); c.classList.add('scale-95');
            setTimeout(()=>{m.classList.add('hidden');m.classList.remove('flex');},300);
        }
        document.addEventListener('keydown',e=>{if(e.key==='Escape')['login','register'].forEach(t=>{const m=document.getElementById(t+'Modal');if(!m.classList.contains('hidden'))closeModal(t);});});

        function showToast(msg, ok=true) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `fixed bottom-6 right-6 transform transition-all duration-300 z-[200] px-6 py-3 rounded-lg shadow-lg font-medium ${ok?'bg-green-600 text-white':'bg-red-600 text-white'}`;
            t.classList.remove('translate-y-20','opacity-0');
            setTimeout(()=>t.classList.add('translate-y-20','opacity-0'),3000);
        }

        // ===== LOGIN REAL =====
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fd = new FormData(this);
            const data = { email: fd.get('email'), password: fd.get('password') };
            try {
                const r = await fetch(`${API}/login`, {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
                });
                const j = await r.json();
                if (r.ok && j.ok) {
                    localStorage.setItem('servilocal_user', JSON.stringify(j.user));
                    showToast('¡Bienvenido, ' + j.user.nombre + '!');
                    closeModal('login');
                    updateNavbar();
                    setTimeout(() => goProfile(), 800);
                } else {
                    showToast(j.message || 'Error al iniciar sesión', false);
                }
            } catch {
                showToast('Error de conexión', false);
            }
        });

        // ===== REGISTRO =====
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fd = new FormData(this);
            const data = Object.fromEntries(fd.entries());
            if (data.password !== data.confirmPassword) { showToast('Las contraseñas no coinciden', false); return; }
            data.fechaRegistro = new Date().toISOString();
            data.id = 'user_' + Date.now();
            delete data.confirmPassword; delete data.terminos;
            try {
                const r = await fetch(`${API}/register`, {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
                });
                const j = await r.json();
                if (r.ok) {
                    showToast('¡Registrado! Redirigiendo...');
                    localStorage.setItem('servilocal_user', JSON.stringify(j.user));
                    closeModal('register');
                    updateNavbar();
                    setTimeout(() => goProfile(), 1000);
                } else {
                    showToast(j.message || 'Error al registrar', false);
                }
            } catch {
                showToast('Error de conexión', false);
            }
        });

        // ===== NAVBAR CON SESIÓN =====
        function updateNavbar() {
            const raw = localStorage.getItem('servilocal_user');
            if (!raw) {
                document.getElementById('navAuth').classList.remove('hidden');
                document.getElementById('navUser').classList.add('hidden');
                return;
            }
            const user = JSON.parse(raw);
            document.getElementById('navAuth').classList.add('hidden');
            document.getElementById('navUser').classList.remove('hidden');
            document.getElementById('navNombre').textContent = user.nombre.split(' ')[0];
        }

        function goProfile() {
            const raw = localStorage.getItem('servilocal_user');
            if (!raw) { openModal('login'); return; }
            const user = JSON.parse(raw);
            if (user.tipo === 'proveedor') location.href = 'perfil_tecnico.html';
            else location.href = 'perfil_cliente.html';
        }

        function logout() {
            localStorage.removeItem('servilocal_user');
            updateNavbar();
            showToast('Sesión cerrada');
            setTimeout(() => location.href = 'index.html', 500);
        }

        // Inicializar navbar al cargar
        updateNavbar();
    </script>
</body>
</html>
